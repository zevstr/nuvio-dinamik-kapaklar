name: Günlük kapakları yenile
on:
  workflow_dispatch:
  schedule:
    # UTC 03:00 / 13:00 = Türkiye 06:00 / 16:00
    - cron: '0 3,13 * * *'

permissions:
  contents: read

concurrency:
  group: pages-covers
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: .poster-cache
          key: turkish-posters-v1-${{ github.run_id }}
          restore-keys: turkish-posters-v1-
      - name: Gerçek katalogdan kapak oluştur
        run: npm run build
        env:
          XPERIENCE_MANIFEST_URL: ${{ secrets.XPERIENCE_MANIFEST_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Kapakları yayınla
        id: deployment
        uses: actions/deploy-pages@v4
